version: '3.1'

services:
  postgres:
    image: postgres:15
    container_name: optimetric-postgres
    restart: always
    environment:
      POSTGRES_DB: optimetric
      POSTGRES_USER: optimetric_user
      POSTGRES_PASSWORD: optimetric_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
