server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/optimetric
    username: optimetric_user
    password: optimetric_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23li47zQLpIecBqzmb
            client-secret: 21f26fe42702591f4e427a380e63e93fe6091d7e
            scope:
              - read:user
              - user:email
              - read:org
              - repo
            redirect-uri: http://localhost:5173/auth/callback
            client-name: GitHub

        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

jwt:
  secret: e1c365c317f94e4abf2040c75a35fc0e
  expiration-ms: 3600000

logging:
  level:
    # Root logging level
    root: INFO
    
    # Application-specific logging
    com.optimetric: DEBUG
    com.optimetric.github.infrastructure.http: DEBUG
    com.optimetric.github.infrastructure.persistence.adapter: DEBUG
    com.optimetric.shared.exception: DEBUG
    
    # Spring Security (for authentication debugging)
    org.springframework.security: INFO
    
    # HTTP client logging (for GitHub API debugging)
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG
    
    # Database logging
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
    # Transaction logging
    org.springframework.transaction: DEBUG
    
  pattern:
    # Console logging pattern with correlation ID support
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
    
    # File logging pattern (if file logging is enabled)
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  
  # Uncomment to enable file logging
  # file:
  #   name: logs/optimetric.log
  #   max-size: 10MB
  #   max-history: 30
